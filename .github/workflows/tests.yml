name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Install validation dependency
        run: |
          python -m pip install --disable-pip-version-check PyYAML

      - name: Validate repository files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          import yaml


          integration = Path(
              "custom_components/dwd_rainradar"
          )

          json_files = sorted(
              integration.rglob(
                  "*.json"
              )
          )

          assert json_files, (
              "No JSON files found."
          )

          for path in json_files:

              with path.open(
                  encoding="utf-8",
              ) as file:

                  json.load(
                      file
                  )

              print(
                  f"JSON OK: {path}"
              )


          quality_path = (
              integration
              / "quality_scale.yaml"
          )

          with quality_path.open(
              encoding="utf-8",
          ) as file:

              quality = yaml.safe_load(
                  file
              )

          assert isinstance(
              quality,
              dict,
          )

          assert isinstance(
              quality.get(
                  "rules"
              ),
              dict,
          )

          print(
              "quality_scale.yaml OK: "
              f"{len(quality['rules'])} rules"
          )


          for filename in (
              "README.md",
              "README.de.md",
          ):

              text = Path(
                  filename
              ).read_text(
                  encoding="utf-8"
              )

              fences = text.count(
                  "```"
              )

              assert fences % 2 == 0, (
                  f"{filename}: "
                  "unclosed Markdown code block"
              )

              print(
                  f"{filename}: "
                  f"{fences} code fences OK"
              )
          PY

      - name: Check Python syntax
        run: |
          python -m compileall -q \
              custom_components/dwd_rainradar \
              tests


  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:

          - role: min
            name: min - HA 2025.3.0 / Python 3.13.2
            runner: ubuntu-24.04
            python-version: "3.13.2"
            pytest-ha-version: "0.13.221"
            ha-version: "2025.3.0"
            coverage: false

          - role: dev
            name: dev - HA 2026.11.2 / Python 3.14.6
            runner: ubuntu-latest
            python-version: "3.14.6"
            pytest-ha-version: "0.13.375"
            ha-version: "2026.11.2"
            coverage: true

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: "ignore::SyntaxWarning"

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimum-version test dependencies
        if: matrix.role == 'min'
        run: |
          python -m pip install \
              --disable-pip-version-check \
              "pytest-homeassistant-custom-component==${{ matrix.pytest-ha-version }}" \
              "h5py==3.16.0"

      - name: Install dev test dependencies
        if: matrix.role == 'dev'
        env:
          HA_VERSION: ${{ matrix.ha-version }}
          UV_LINK_MODE: copy
          FIXTURE_VERSION: ${{ matrix.pytest-ha-version }}
        run: |
          python -m pip install "uv==0.13.9"
          printf 'homeassistant==%s\n' "$HA_VERSION" > "$RUNNER_TEMP/ha-dev-override.txt"
          uv pip install --python "$(command -v python)" \
            --override "$RUNNER_TEMP/ha-dev-override.txt" \
            "pytest-homeassistant-custom-component==$FIXTURE_VERSION" \
            "h5py==3.16.0"

      # Fixture 0.13.375 targets Core 2026.10.4. In 2026.11 the logger
      # test helper moved to helpers.py. Remove this when the fixture catches up.
      - name: Adapt dev test fixture to Core 2026.11
        if: matrix.role == 'dev'
        run: |
          python - <<'PYTHON'
          from importlib.metadata import distribution
          from pathlib import Path

          fixture = distribution("pytest-homeassistant-custom-component")
          path = Path(fixture.locate_file("pytest_homeassistant_custom_component/common.py"))
          original = path.read_text()
          old = "    _clear_logger_overwrites,\n)"
          new = ")\nfrom homeassistant.components.logger.helpers import _clear_logger_overwrites"
          if fixture.version != "0.13.375" or original.count(old) != 1:
              raise SystemExit("Review the dev fixture compatibility step")
          path.write_text(original.replace(old, new))
          PYTHON

      - name: Verify and show test environment
        env:
          EXPECTED_HA: ${{ matrix.ha-version }}
        run: |
          python - <<'PY'
          import os
          import sys
          from importlib.metadata import version


          print(
              "Python:",
              sys.version,
          )

          expected = os.environ["EXPECTED_HA"]
          if version("homeassistant") != expected:
              raise SystemExit(f"Expected Home Assistant {expected}, got {version('homeassistant')}")

          for package in (
              "homeassistant",
              "pytest-homeassistant-custom-component",
              "pytest",
              "pytest-cov",
              "h5py",
          ):

              print(
                  f"{package}: "
                  f"{version(package)}"
              )
          PY

      - name: Check Python syntax
        run: |
          python -m compileall -q \
              custom_components/dwd_rainradar \
              tests

      - name: Run minimum-version tests
        if: ${{ !matrix.coverage }}
        run: |
          python -m pytest \
              -p no:cacheprovider \
              --basetemp=/tmp/dwd-rainradar-pytest \
              -q \
              tests

      - name: Run current tests with coverage
        if: ${{ matrix.coverage }}
        env:
          COVERAGE_FILE: /tmp/dwd-rainradar.coverage
        run: |
          # Core registers its HTTP client alias before pytest loads plugins.
          python -c 'import homeassistant, pytest; raise SystemExit(pytest.main())' \
              -p no:cacheprovider \
              --basetemp=/tmp/dwd-rainradar-pytest \
              --cov=custom_components.dwd_rainradar \
              --cov-report=term-missing \
              --cov-fail-under=100 \
              tests
